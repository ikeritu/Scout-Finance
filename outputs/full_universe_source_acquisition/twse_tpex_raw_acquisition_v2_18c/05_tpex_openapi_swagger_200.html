<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>

    <style>
      html
      {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }

      *,
      *:before,
      *:after
      {
        box-sizing: inherit;
      }

      body

        background: #fafafa;
      }

        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl

        layout: "StandaloneLayout",
        requestInterceptor: function(req) { req.headers['If-Modified-Since'] = 'Mon, 26 Jul 1997 05:00:00 GMT'; req.headers['Cache-Control'] = 'no-cache'; req.headers['Pragma'] = 'no-cache'; return req; },
        url: "https://www.tpex.org.tw/openapi/swagger.json",
      })
      
      
      // End Swagger UI call region








      window.ui = ui;
    };
  </script>
