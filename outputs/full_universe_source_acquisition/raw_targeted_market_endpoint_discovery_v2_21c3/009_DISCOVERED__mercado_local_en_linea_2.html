ga para tal fin.\n \nTeniendo en cuenta lo anterior, yo autorizo de manera voluntaria, previa, explícita, informada e inequívoca a las Compañías para tratar mis datos personales y mis “datos sensibles” de acuerdo con la Política de Tratamiento de Datos Personales de las Compañías y para los fines relacionados con su objeto social y en especial para fines legales, contractuales, comerciales, de almacenamiento, uso, autenticación de identidad, mecanismo de prueba de vida, encuestas digitales, investigaciones de mercado, envío de comunicaciones, envío de cursos educativos ofrecidos por las Compañías, realizar comunicaciones oficiales, entrega de información relevante, realizar notificaciones de la cuenta, entrega de piezas y contenidos publicitarios, dar soporte a PQRS, solucionar inconsistencias o inconvenientes presentados con los servicios de las Compañías. Así mismo, declaro que estoy autorizando para transferir y/ o transmitir los datos personales a terceros que suministre a las Compañías en relación con las finalidades de Tratamiento antes indicadas. La información obtenida para el Tratamiento de mis datos personales la he suministrado de forma voluntaria y es verídica.\u003c/p\u003e"},"footer":{"proceduresAndCertificates":{"title":"Trámites y certificados","links":[{"text":"Certificados tributarios","url":"https://grupobvc.portalproveedoresco.co/","isExternalLink":null},{"text":"Pagos de facturas en línea deceval","url":"https://www.e-collect.com/customers/plus/DecevalPagosPlus.htm","isExternalLink":false},{"text":"Pagos en línea servicios generales","url":"https://www.e-collect.com/customers/PagosBVC.htm","isExternalLink":null},{"text":"Pagos en línea Renta Variable Comisionistas","url":"https://gateway1.ecollect.co/eCollectPlus/SignIn.aspx","isExternalLink":null}]},"interesSites":{"title":"Sitios de interés","links":[{"text":"Estado de servicios bvc","url":"https://estadoservicios.nuamx.com/","isExternalLink":false},{"text":"Listado sitios de interés","url":"h
