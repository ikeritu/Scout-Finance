:"https://www.nuamx.com/","fileName":"nuam exchange.png"},{"text":"bvc Sostenible","icon":"https://us-east-1-bolsa-co.graphassets.com/AxNCx6kQD2In72lKLctqAz/EChYZhUGR7mvcHDlO32w","url":"https://bvc.co/enfoque-y-vision","fileName":"sostenibilidad 2 (1).svg"},{"text":"Estado de servicios bvc","icon":"https://us-east-1-bolsa-co.graphassets.com/AxNCx6kQD2In72lKLctqAz/C8pG5IG2Q5qfKg26Akkz","url":"https://estadoservicios.nuamx.com/","fileName":"Estado de servicios.svg"}],"newsletter":{"inputLabel":"Correo electrónico","inputPlaceholder":"Quiero tomar buenas decisiones.","newsletterText":"Suscríbete y recibe información de valor que te ayudará a tomar buenas decisiones.","termsAndConditionsTitle":"Términos y condiciones","normalCheckboxLabel":"Conoce y acepta la política de","underlinedCheckboxLabel":"tratamiento de datos.","termsAndConditionsContent":"\u003cp\u003e\u003cstrong\u003ePolítica tratamiento de datos\n\u003c/strong\u003e\nCon la aceptación de esta autorización, manifiesto que he sido informado por bvc y sus empresas filiales y asociadas en adelante se denominará “Compañías” que:\n\n1.  Las Compañías actuarán como Responsables del Tratamiento de datos personales de los cuales soy titular y que, conjunta o separadamente podrán recolectar, usar, transferir, transmitir y tratar mis datos personales conforme la Política de Tratamiento de Datos Personales de las Compañías disponible en www.bvc.com.co\n2.  Es de carácter facultativo responder preguntas que versen sobre Datos Sensibles o sobre menores de edad.\n3.  El titular del dato sensible no está obligado autorizar su tratamiento por parte de las compañías.\n4.  Mis derechos como titular de los datos son los previstos en la Constitución y la ley, especialmente el derecho a conocer, actualizar, rectificar y suprimir mi información personal, así como el derecho a revocar el consentimiento otorgado para el tratamiento de datos personales y datos sensibles.\n5.  Los derechos pueden ser ejercidos a través de los canales gratuitos dispuestos por las Compañías y observando la Política de Tratamiento de Datos Personales de las Compañías.\n6.  Para cualquier inquietud o información adicional relacionada con el tratamiento de datos personales, puede contactarme al correo electrónico datospersonales@bvc.com.co o al teléfono 6068666.\n7.   Las Compañías garantizan la confidencialidad, libertad, seguridad, veracidad, transparencia, acceso y circulación restringida de mis datos y se reservan el derecho de modificar su Política de Tratamiento de Datos Personales en cualquier momento. Cualquier cambio será informado y publicado oportunamente en la página web o a través de los medios que disponga para tal fin.\n \nTeniendo en cuenta lo anterior, yo autorizo de manera voluntaria, previa, explícita, informada e inequívoca a las Compañías para tratar mis datos personales y mis “datos sensibles” de acuerdo con la Política de Tratamiento de Datos Personales de las Compañías y para los fines relacionados con su objeto social y en especial para fines legales, contractuales, comerciales, de almacenamiento, uso, autenticación de identidad, mecanismo de prueba de vida, encuestas digitales, investigaciones de mercado, envío de comunicaciones, envío de cursos educativos ofrecidos por las Compañías, realizar comunicaciones oficiales, entrega de información relevante, realizar notificaciones de la cuenta, entrega de piezas y contenidos publicitarios, dar soporte a PQRS, solucionar inconsistencias o inconvenientes presentados con los servicios de las Compañías. Así mismo, declaro que estoy autorizando para transferir y/ o transmitir los datos personales a terceros que suministre a las Compañías en relación con las finalidades de Tratamiento antes indicadas. La información obtenida para el Tratamiento de mis datos personales la he suministrado de forma voluntaria y es verídica.\u003c/p\u003e"},"footer":{"proceduresAndCertificates":{"title":"Trámites y certificados","links":[{"text":"Certificados tributarios ctualizados para un acceso sin problemas a bvc digital, nuestra nueva plataforma que reemplazará el portal deceval.","buttons":[{"id":"clka8i4tm1lqv0blcefp7adkb","text":"¡Actualiza aquí tus datos!","url":"https://forms.gle/WmbcJpR5CjZ2QuwQA"},{"id":"ckgqk584g2u8r0981l8l7xg9v","text":"Ingresa al portal deceval","url":"https://seguridad.deceval.com.co/sso/jsp/login.jsp?site2pstoretoken=v1.2~DDA0A246~9FB8387BC96F9ED2D1E8B39755B6DB26313AA4532C361D089B0795B2513960E7A62A653F323B6E610D06739BA46687F2C5E0BD6BC6511E6C01513F1B15A91F54925C91952862597EB81B7FE5287253D9F4D4637D0D064026C35BD754B71FC5277C1CC0C0772BC464EF405B129C62A7B804E5A058E28276899B6014E84FECCADA18AC2A0E97D5F79244ACD926B4E9B62CA04CCD5B46B699AF3AE04E16616A973B8274E6A012CA55BA32D81DF3F1653CBB172C5E4154B7AAA0E40054A2D53CE05209CAC317DF1BE4188479BDDBAF2C712D83A0D3EC6CD77253BFB6799C808EFFAAA74D2F5BD9637FA19635D92F973D3CF16446169656FCB94F\u0026p_error_code=\u0026p_submit_url=https%3A%2F%2Fseguridad.deceval.com.co%2Fsso%2Fauth\u0026p_cancel_url=https%3A%2F%2Fwww.deceval.com.co%2Fportal%2Fpls%2Fportal%2FPORTAL.home\u0026ssousername="}]}},"url":"/renta-variable-descripcion-general","page":{"identifier":"home","isCanvas":true,"content":[{"section":{"title":null,"description":null},"content":[{"name":"Main_Banner_Canvas","props":{"banners":[{"backgroundFilter":"FF411C","backgroundImg":"https://us-east-1-bolsa-co.graphassets.com/AxNCx6kQD2In72lKLctqAz/jrxLwYynR069jO9oQ8hh","backgroundSmallImg":"https://us-east-1-bolsa-co.graphassets.com/AxNCx6kQD2In72lKLctqAz/5B71i7XiQpmBtUoyzazq","title":"Renta variable","paragraph":"Las fuerzas de la oferta y la demanda son las que determinan los riesgos y las ganancias de los inversionistas. ","video":null,"buttonCaption":null,"buttonUrl":null,"logo":null}],"isFluid":true}},{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichParagraph","content":{"html":"\u003cp\u003eEn el mercado de renta variable se negocian títulos valores cuyos rendimientos no están establecidos y en gran parte dependen de las utilidades obtenidas por la empresa en la cual se invierte, así como de las posibles variaciones en los precios de los valores, dadas por las condiciones existentes en el mercado. Las acciones son el título emblemático de este mercado.  \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eLa Bolsa de Valores de Colombia administra el sistema transaccional para la negociación de acciones, soportada en la plataforma de negociación X-Stream de Nasdaq-OMX. La gran variedad de negocios que se pueden hacer gracias a esta infraestructura es una muestra adicional de la solidez, dinamismo y transparencia del mercado de capitales en Colombia.  \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eEn cuanto a la intermediación de este tipo de productos, las únicas compañías autorizadas en Colombia para la negociación de títulos de renta variable son las Sociedades Comisionistas de Bolsa.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e"}}],"link":null}]}}]},{"section":{"title":"Productos y servicios","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":"X-Stream: más que una solución de negociación","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEn su propósito de fomentar el desarrollo del mercado de capitales local, \u003cstrong\u003ebvc\u003c/strong\u003e cuenta con X-Stream Workstation, la cual es una plataforma electrónica de negociación de alto desempeño, que le permite a los usuarios a través de una amplia variedad de funciones la compra y venta de títulos valores, la visualización de información de mercado en tiempo real y la creación de estrategias multiproducto dentro de los mercados administrados por \u003cstrong\u003ebvc\u003c/strong\u003e. X-Stream Workstation, además de facilitar el proceso de negociación de los diferentes títulos valores, brinda transparencia en esta actividad y facilita la vigilancia de los diferentes entes de control.\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Mercado Global Colombiano","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEl Mercado Global Colombiano (MGC) es un sistema de cotización de valores extranjeros que \u003cstrong\u003ebvc\u003c/strong\u003e pone a disposición del público general (clientes inversionistas e inversionistas profesionales) para habilitar la la posibilidad de comprar y vender valores extranjeros listados en mercados internacionales, a través de una Sociedad Comisionista de Bolsa (SCB) local y bajo la infraestructura del mercado de acciones colombiano.\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Fondos bursátiles o Exchange Traded Funds (ETF)","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEstos instrumentos son fondos de inversión cuyas unidades de participación se negocian en mercados electrónicos en tiempo real de la misma manera que cualquier acción. Los \u003cstrong\u003eETF\u003c/strong\u003e siguen la evolución de índices accionarios, de renta fija o materias primas, proporcionando a los inversionistas un acceso eficiente a muchos activos. Las unidades de participación de los \u003cstrong\u003eETF\u0026#39;s\u003c/strong\u003e se deben comprar y vender mediante una Sociedad Comisionista de Bolsa.\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Las Transferencias Temporales de Valores (TTV)","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eLa transferencia temporal de valores -\u003cstrong\u003e TTV\u003c/strong\u003e son operaciones que permiten que un inversionista originador transfiera temporalmente la propiedad de sus acciones a otro inversionista receptor, que necesita los valores de forma temporal. Este producto acelera el intercambio de títulos, fortalece la rentabilidad y genera liquidez en el mercado.\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Repos","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEl mercado Repo permite que un inversionista obtenga recursos (dinero) de forma temporal, entregando acciones como garantía a otro inversionista que está dispuesto a prestar el dinero a cambio de un interés determinado. Las operaciones se realizan a través de la plataforma X-Stream.\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Transferencias Temporales de Valores - Mercado Mostrador (TTV OTC):","content":[{"componentType":"PdRichParagraph","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eLas \u003cstrong\u003eTTV\u003c/strong\u003e negociadas en el mercado mostrador, son préstamos de valores en los que el originador transfiere la propiedad de unos valores al receptor, quien a su vez le transfiere al originador la propiedad de otros valores como garantía. La negociación de este tipo de operaciones se realizan de forma bilateral en el mercado mostrador (OTC). \u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"El mercado Integrado Latinoamericano (MILA)","content":[{"componentType":"PdRichParagraph","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEl Mercado Integrado Latinoamericano MILA entró en operación el 30 de mayo de 2011, reuniendo así a la Bolsa de Valores de Colombia, la Bolsa de Comercio de Santiago, la Bolsa de Valores de Lima y la Bolsa Mexicana de Valores así como de los depósitos deceval, DCV, CAVALI e INDEVAL en un solo mercado. \u003c/div\u003e\u003cdiv\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMILA es un mercado que permite el acceso simple y eficiente a cuatro mercados, dando la posibilidad a los participantes de ampliar el portafolio de productos y servicios que puedes ofrecer a los inversionistas. \u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Custodios","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003e\u003cp\u003eLa figura de Custodio contribuye a la seguridad del mercado, el aprovechamiento de las economías de escala, amplía la oferta de nuevos productos a los inversionistas y permite consolidar a Colombia como un mercado atractivo y de calidad.  Así mismo, facilita el acceso al mercado colombiano de los inversionistas no residentes e institucionales y permite mejorar las condiciones de cumplimiento para las operaciones MILA.\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null}]}}]},{"section":{"title":"El Mercado Integrado Latinoamericano (MILA)","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichParagraph","content":{"html":"\u003cp\u003e\u003cstrong\u003eMILA\u003c/strong\u003e es el resultado de la integración de las bolsas y depósitos de Chile, Colombia, México y Perú. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eEste amplio mercado del que bvc hace parte ofrece una gran variedad de oportunidades para comprar y vender valores mediante: \u003c/strong\u003e\u003c/p\u003e"}}],"link":null},{"title":"Mila Trader","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEl sistema que permite generar órdenes de compra y venta de valores bajo las reglas, condiciones y horarios definidos por la respectiva bolsa. \u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null},{"title":"Mila Gestión","content":[{"componentType":"PdRichList","content":{"html":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eEl aplicativo utilizado por los afiliados para la administración de convenios y cupos para la negociación en MILA.\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e"}}],"link":null}]}}]},{"section":{"title":"Comité Técnico Mercado de Renta Variable","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichList","content":{"html":"\u003cp\u003eEl Comité Técnico de Renta Variable es un órgano de carácter consultivo, cuyo objetivo es apoyar a \u003cstrong\u003ebvc \u003c/strong\u003een el desarrollo del mercado de renta variable. \u003c/p\u003e\u003cp\u003eSus funciones son: \u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cdiv\u003ePromover el desarrollo del mercado accionario a partir de conceptos técnicos y de mercado, realizando una labor de interlocutor del mercado de renta variable.\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eProponer modificaciones o adiciones a la normatividad o a nuevos productos y formular sugerencias al Consejo Directivo de bvc sobre los mismos.\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eProponer modificaciones o adiciones a la reglamentación del sistema o a nuevos productos y formular sugerencias a bvc sobre los mismos.\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eEstudiar reglas aplicables al funcionamiento del mercado accionario y proponer los ajustes y cambios de acuerdo con las necesidades del mercado.\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003e Ejercer las demás funciones de carácter consultivo que establezca bvc en su Reglamento o Circular.\u003c/div\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003c/p\u003e"}}],"link":null}]}}]},{"section":{"title":"Miembros del Comité","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichParagraph","content":{"html":"\u003cp\u003eEl Comité Técnico de Renta Variable estará integrado por mínimo 5 miembros y máximo 8 miembros y sus correspondientes suplentes personales.\u003c/p\u003e\u003cp\u003eMiembros Principales\u003c/p\u003e\u003cp\u003e\u003c/p\u003e"}}],"link":null}]}},{"name":"Rich_Text_Card","props":{"items":[{"title":"Sociedad Comisionista de Bolsa","text":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eAlianza Valores\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eBTG Pactual\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eCasa de Bolsa\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eCredicorp Capital\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eDavivienda Corredores\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eItaú SCB\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eLarraín Vial\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eValores Bancolombia\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e","buttonText":null,"buttonUrl":null,"isButton":true},{"title":"Nombre","text":"\u003cul\u003e\u003cli\u003e\u003cdiv\u003eJorge Enrique Maya Llano\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eAndrés González Latorre\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eAlejandro Forero Marulanda\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eJaime Ricardo Acosta Pinto\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eKarla Duarte\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eSergio Naranjo Jaramillo\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eDaniel Fonnegra\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cdiv\u003eJuan Guillermo Hernández\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e","buttonText":null,"buttonUrl":null,"isButton":true}]}}]},{"section":{"title":"Reuniones del Comité de Renta Variable","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichParagraph","content":{"html":"\u003cp\u003eEl Comité se reunirá en forma ordinaria una vez cada 3 meses, en el día, hora y lugar indicados en la convocatoria efectuada por \u003cstrong\u003ebvc\u003c/strong\u003e. También se reunirá de forma extraordinaria cuando sea convocado por \u003cstrong\u003ebvc\u003c/strong\u003e, o cuando lo soliciten no menos de 3 de sus miembros.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eEl Comité Técnico nombrará un Presidente que presidirá el Comité, así como un Secretario para el periodo que el propio Comité determine. Para la validez de las deliberaciones del Comité Técnico deberán concurrir no menos de 3 de sus miembros y las decisiones se adoptarán por mayoría de los miembros presentes. Los invitados tendrán voz sin derecho a voto.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eDe lo sucedido en las reuniones del Comité Técnico se levantarán las ayudas de memoria o actas correspondientes, que serán firmadas por el Presidente y Secretario del Comité.\u003c/p\u003e\u003cp\u003ePara mayor información sobre el Comité Técnico, puedes consultar la Circular Única\u003cstrong\u003e bvc \u003c/strong\u003e(Sección VII - Del Comité Técnico de Renta Variable) y el Reglamento General bvc (Capítulo tercero: Comité Técnico de Renta Variable).\u003c/p\u003e"}}],"link":null}]}}]},{"section":{"title":"Cómo negociar títulos de renta variable","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichList","content":{"html":"\u003cp\u003eAquí encuentras los requisitos y tarifas que nuestros afiliados deben cumplir para comprar y vender títulos en el mercado de renta variable. \u003c/p\u003e"}}],"link":null}]}},{"name":"Tabs_Downloads","props":{"files":[{"filters":[{"type":"category","enabled":null,"options":[]},{"type":"date","enabled":null},{"type":"search","enabled":false}],"tabs":[{"title":"01","type":"Block","records":[{"id":"","title":"","description":"","date":"","cardFile":{"fileName":"","url":""},"category":"","modalDownload":""}],"seo":{}}],"pdFileId":"ckkfhsroo2cck0a69f3oiksb8","placeholderSearchField":""}]}}]},{"section":{"title":"Herramientas Sistemas de Negociación","description":null},"content":[{"name":"Rich_Text","props":{"richTexts":[{"title":null,"content":[{"componentType":"PdRichList","co
